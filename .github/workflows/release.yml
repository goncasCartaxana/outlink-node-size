name: Release

# Push a tag that exactly matches manifest.json's version (e.g. 1.0.1, no "v")
# and this builds the plugin and publishes a GitHub release with the files
# Obsidian needs.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Verify tag matches manifest version
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match manifest.json version '$manifest_version'"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes main.js manifest.json
